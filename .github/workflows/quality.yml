name: Quality gates

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run type-check
      - run: npm run lint -- --no-cache
      - run: npm run build

  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint -- --no-cache
      - run: npm run build
